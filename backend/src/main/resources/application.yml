spring:
  application:
    name: acik-arttirma-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auction}
    username: ${DB_USER:auction}
    password: ${DB_PASSWORD:auction}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
